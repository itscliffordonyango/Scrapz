<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Scrapz Research{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/">scrapz<span>.</span></a>
    <nav aria-label="Primary navigation">
      <a href="/">Overview</a>
      <a href="/records">Records</a>
      <a href="/analytics">Analytics</a>
      {% if user.role == "admin" %}<a href="/sources">Sources</a>{% endif %}
    </nav>
    <div class="account">
      <span>{{ user.username }} <small>{{ user.role }}</small></span>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <button class="button button-quiet" type="submit">Sign out</button>
      </form>
    </div>
  </header>
  {% endif %}
  <main class="{% if user %}page{% else %}auth-page{% endif %}">
    {% if notice %}<div class="notice" role="status">{{ notice }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
